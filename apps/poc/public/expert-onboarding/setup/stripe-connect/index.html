<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stripe Connect · S7</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/expert-onboarding/shared/create-space-snippet.js"></script>
</head>
<body class="min-h-screen bg-violet-950 text-white">
  <div id="gate"></div>
  <div id="app" class="hidden">
    <main class="mx-auto max-w-lg px-6 py-12">
      <a href="/expert-onboarding" class="text-sm text-violet-300">← Hub</a>
      <p class="mt-6 text-xs uppercase tracking-widest text-violet-400">S7 · Stripe Connect</p>
      <h1 class="mt-4 text-3xl font-semibold">Connect payouts</h1>
      <p class="mt-3 text-violet-200">Whop-inspired payout setup mock.</p>
      <div id="chip" class="mt-8 inline-block rounded-full bg-amber-500/20 px-3 py-1 text-sm text-amber-200">Not connected</div>
      <button id="connect" type="button" class="mt-8 w-full rounded-xl bg-white py-3 font-medium text-violet-950">Connect Stripe (mock)</button>
    </main>
  </div>
  <script>
    const SLUG='stripe-connect';
    const SEED={spaceCreated:true,workspaceName:"Ana's Expert Space"};
    function labLoad(){try{var r=localStorage.getItem('eleva-lab:'+SLUG);return r?{...SEED,...JSON.parse(r)}:SEED}catch(e){return SEED}}
    function labSave(d){try{localStorage.setItem('eleva-lab:'+SLUG,JSON.stringify(d))}catch(e){}}
    let draft=labLoad();
    document.getElementById('connect').onclick=()=>{draft.stripeDone=true;labSave(draft);document.getElementById('chip').textContent='Connected';document.getElementById('chip').className='mt-8 inline-block rounded-full bg-emerald-500/20 px-3 py-1 text-sm text-emerald-200'};
    ElevaCreateSpaceGate.mount('gate', SLUG, ()=>{draft={...SEED,...labLoad(),spaceCreated:true};labSave(draft);document.getElementById('app').classList.remove('hidden');if(draft.stripeDone)document.getElementById('connect').click()});
  </script>
</body>
</html>
