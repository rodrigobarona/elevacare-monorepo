<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Sweep · Eleva Design Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .display { font-family: 'Playfair Display', serif; }
    .segment { transition: background 0.35s ease; }
  </style>
</head>
<body class="min-h-screen bg-[#faf8f6] text-stone-900">
  <header class="flex items-center justify-between px-6 py-4">
    <a href="/expert-onboarding" class="text-sm text-stone-500 hover:text-stone-800">← Design Lab</a>
    <span class="text-xs font-medium uppercase tracking-widest text-rose-400">Fresha-inspired · L2</span>
  </header>

  <div id="segments" class="mx-auto flex max-w-lg gap-1 px-6 pt-2"></div>

  <main id="stage" class="mx-auto flex min-h-[calc(100vh-8rem)] max-w-lg flex-col justify-center px-6 py-12"></main>

  <footer class="fixed bottom-0 inset-x-0 border-t border-stone-200/80 bg-white/90 backdrop-blur px-6 py-4">
    <div class="mx-auto flex max-w-lg items-center justify-between gap-4">
      <button id="backBtn" type="button" class="text-sm text-stone-500 hover:text-stone-800 disabled:invisible">Back</button>
      <button id="nextBtn" type="button" class="rounded-full bg-stone-900 px-8 py-3 text-sm font-medium text-white hover:bg-stone-800">Continue</button>
    </div>
  </footer>

  <script>
    const SLUG = 'focus-sweep';
    const STEPS = [
      { id: 'specialty', title: 'What do you offer members?', hint: 'Pick your primary practice area.', optional: false,
        render: (d) => `<div class="grid gap-3">${['Mental wellbeing','Nutrition & diet','Movement & rehab','Sleep & recovery'].map(s =>
          `<button type="button" data-val="${s}" class="choice rounded-2xl border-2 px-5 py-4 text-left text-lg ${d.specialty===s?'border-rose-400 bg-rose-50':'border-stone-200 bg-white hover:border-stone-300'}">${s}</button>`).join('')}</div>` },
      { id: 'country', title: 'Where do you practice?', hint: 'Compliance rules depend on country.', optional: false,
        render: (d) => `<div class="flex gap-3">${['PT','ES','BR'].map(c =>
          `<button type="button" data-val="${c}" class="choice flex-1 rounded-2xl border-2 py-5 text-xl font-medium ${d.practiceCountry===c?'border-rose-400 bg-rose-50':'border-stone-200 bg-white'}">${c}</button>`).join('')}</div>` },
      { id: 'city', title: 'Which city?', hint: 'Members search by location — you can refine your address later.', optional: true,
        render: (d) => `<input id="cityInput" type="text" value="${d.city||''}" placeholder="Lisbon" class="display w-full border-0 border-b-2 border-stone-300 bg-transparent py-3 text-4xl outline-none focus:border-rose-400" />` },
      { id: 'session', title: 'Name your first session', hint: 'What will members book?', optional: false,
        render: (d) => `<input id="sessionInput" type="text" value="${d.sessionTitle||''}" placeholder="Intro consultation" class="display w-full border-0 border-b-2 border-stone-300 bg-transparent py-3 text-3xl outline-none focus:border-rose-400" />` },
      { id: 'price', title: 'Set a price', hint: 'You can add intro offers later in your dashboard.', optional: true,
        render: (d) => `<div class="flex items-baseline gap-2"><span class="text-3xl text-stone-400">€</span><input id="priceInput" type="number" value="${d.eventPrice||''}" placeholder="45" class="display w-full border-0 border-b-2 border-stone-300 bg-transparent py-3 text-5xl outline-none focus:border-rose-400" /></div>` },
      { id: 'done', title: "You're set for now", hint: "Finish photos, payouts, and compliance when you're ready to publish.", optional: false,
        render: (d) => `<div class="space-y-4 rounded-2xl bg-white p-6 shadow-sm"><p class="text-lg"><strong>${d.sessionTitle||'Your session'}</strong> · ${d.practiceCountry||'—'} · €${d.eventPrice||'—'}</p><ul class="space-y-2 text-sm text-stone-600"><li class="flex gap-2"><span class="text-rose-400">○</span> Add profile photos</li><li class="flex gap-2"><span class="text-rose-400">○</span> Connect Stripe payouts</li><li class="flex gap-2"><span class="text-rose-400">○</span> Complete compliance gate</li></ul><a href="/expert-onboarding" class="inline-block text-sm font-medium text-rose-500 hover:underline">Back to Design Lab</a></div>` },
    ];

    function labLoad(){try{var r=localStorage.getItem('eleva-lab:'+SLUG);return r?JSON.parse(r):{}}catch(e){return{}}}
    function labSave(d){try{localStorage.setItem('eleva-lab:'+SLUG,JSON.stringify(d))}catch(e){}}

    let step = 0;
    let draft = labLoad();

    function renderSegments() {
      document.getElementById('segments').innerHTML = STEPS.map((_, i) =>
        `<div class="segment h-1.5 flex-1 rounded-full ${i <= step ? 'bg-rose-400' : 'bg-stone-200'}"></div>`
      ).join('');
    }

    function bindChoices() {
      document.querySelectorAll('.choice').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = step === 0 ? 'specialty' : 'practiceCountry';
          draft[key] = btn.dataset.val;
          labSave(draft);
          render();
        });
      });
      const cityInput = document.getElementById('cityInput');
      if (cityInput) cityInput.oninput = e => { draft.city = e.target.value; labSave(draft); };
      const sessionInput = document.getElementById('sessionInput');
      if (sessionInput) sessionInput.oninput = e => { draft.sessionTitle = e.target.value; labSave(draft); };
      const priceInput = document.getElementById('priceInput');
      if (priceInput) priceInput.oninput = e => { draft.eventPrice = e.target.value; labSave(draft); };
    }

    function render() {
      const s = STEPS[step];
      document.getElementById('stage').innerHTML = `
        <p class="text-xs font-medium uppercase tracking-widest text-rose-400">${s.optional ? 'Optional' : 'Required'}</p>
        <h1 class="display mt-4 text-4xl leading-tight text-stone-900 sm:text-5xl">${s.title}</h1>
        <p class="mt-4 text-lg text-stone-500">${s.hint}</p>
        <div class="mt-10">${s.render(draft)}</div>`;
      renderSegments();
      document.getElementById('backBtn').disabled = step === 0;
      document.getElementById('nextBtn').textContent = step === STEPS.length - 1 ? 'Done' : (s.optional ? 'Skip for now' : 'Continue');
      bindChoices();
    }

    document.getElementById('backBtn').onclick = () => { if (step > 0) { step--; render(); } };
    document.getElementById('nextBtn').onclick = () => {
      if (step < STEPS.length - 1) { step++; render(); }
      else location.href = '/expert-onboarding';
    };

    render();
  </script>
</body>
</html>
