name: neon-branch

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: neon-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  neon-branch-migrate-and-rls:
    name: neon-branch-migrate-and-rls
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve Neon credentials
        id: neon-creds
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "::error::Add GitHub secret NEON_API_KEY and secret or variable NEON_PROJECT_ID (docs/eleva-v3/environment-matrix.md). The neon-branch-migrate-and-rls job must not pass without a live branch."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Neon branch on fork PR (credentials unavailable)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.neon-creds.outputs.ready == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.neon-creds.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.neon-creds.outputs.ready == 'true'

      - name: Create Neon branch
        if: steps.neon-creds.outputs.ready == 'true'
        id: create-branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Reset Neon branch to parent
        if: steps.neon-creds.outputs.ready == 'true'
        id: reset-branch
        uses: neondatabase/reset-branch-action@470ab8101095ea33737c294d17364a72fd80761b # v1.3.2
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Derive audit database URL
        if: steps.neon-creds.outputs.ready == 'true'
        id: audit-url
        env:
          DATABASE_URL: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
        run: |
          # Same Neon project/branch; second database is `audit` (not a second project).
          audit_url="$(python3 -c 'import os; from urllib.parse import urlparse, urlunparse; p=urlparse(os.environ["DATABASE_URL"]); print(urlunparse(p._replace(path="/audit")), end="")')"
          echo "::add-mask::${audit_url}"
          {
            echo "db_url<<EOF"
            echo "${audit_url}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Migrate and apply main + audit RLS
        if: steps.neon-creds.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          AUDIT_DATABASE_URL: ${{ steps.audit-url.outputs.db_url }}
          AUDIT_DATABASE_URL_UNPOOLED: ${{ steps.audit-url.outputs.db_url }}
        run: |
          # db:* scripts load ../../.env.local; CI injects DATABASE_URL instead.
          touch .env.local
          pnpm --filter=@eleva/db db:migrate
          pnpm --filter=@eleva/db db:rls:main
          pnpm --filter=@eleva/db db:migrate:audit
          pnpm --filter=@eleva/db db:rls:audit

      - name: RLS isolation and class suite
        if: steps.neon-creds.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          AUDIT_DATABASE_URL: ${{ steps.audit-url.outputs.db_url }}
          AUDIT_DATABASE_URL_UNPOOLED: ${{ steps.audit-url.outputs.db_url }}
          ELEVA_RLS_INTEGRATION: "1"
        run: pnpm --filter=@eleva/db exec vitest run src/__tests__/rls-isolation.test.ts src/__tests__/rls-classes.test.ts

  delete-branch:
    name: neon-branch-delete
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Neon credentials
        id: neon-creds
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "::error::Add GitHub secret NEON_API_KEY and secret or variable NEON_PROJECT_ID so closed same-repo PRs delete their Neon branch."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Neon branch delete on fork PR (credentials unavailable)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete Neon branch
        if: steps.neon-creds.outputs.ready == 'true'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
