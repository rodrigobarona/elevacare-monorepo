name: neon-branch

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: neon-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # A pull request's database branch deletes itself this many days after its
  # last run of this workflow. It is only used by this job (Vercel previews
  # use the `preview` branch), so losing it costs one re-run, and a push
  # makes it again. Seven days is well inside Neon's 30-day maximum and long
  # enough that work in review does not lose its branch over a weekend.
  NEON_PR_BRANCH_TTL_DAYS: 7

jobs:
  neon-branch-migrate-and-rls:
    name: neon-branch-migrate-and-rls
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve Neon credentials
        id: neon-creds
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "::error::Add GitHub secret NEON_API_KEY and secret or variable NEON_PROJECT_ID (docs/eleva-v3/environment-matrix.md). The neon-branch-migrate-and-rls job must not pass without a live branch."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Neon branch on fork PR (credentials unavailable)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.neon-creds.outputs.ready == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.neon-creds.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.neon-creds.outputs.ready == 'true'

      - name: Create Neon branch
        if: steps.neon-creds.outputs.ready == 'true'
        id: create-branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.number }}
          # Fork the schema-only `preview` branch (synthetic seed data), never
          # production `main`: PR code must not see member data.
          parent_branch: preview
          database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Reset Neon branch to parent
        if: steps.neon-creds.outputs.ready == 'true'
        id: reset-branch
        uses: neondatabase/reset-branch-action@470ab8101095ea33737c294d17364a72fd80761b # v1.3.2
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          parent: true
          cs_database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}

      # A branch that outlives its pull request holds one of the project's
      # few branch slots; six open pull requests once used them all. Neon
      # deletes an expired branch by itself. Set after every reset, so each
      # push moves the date, and a branch made before this step existed gets
      # one too. If Neon refuses (the API marks the field early access), the
      # job goes on: the delete on close and the nightly sweep still apply.
      - name: Set the branch to expire
        if: steps.neon-creds.outputs.ready == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.create-branch.outputs.branch_id }}
          EXPECTED_NAME: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}"
          summary='.branch | {name, default, protected, expires_at, ttl_interval_seconds}'
          answer="${RUNNER_TEMP}/neon-branch.json"
          # Only the refusal below may fail this job: a network error while
          # asking Neon is a warning, the database tests still run.
          if ! curl -fsS --max-time 30 --retry 2 -o "$answer" \
            -H "Authorization: Bearer ${NEON_API_KEY}" "$api"; then
            echo "::warning::Could not read ${EXPECTED_NAME} from Neon; no expiry was set on this run."
            exit 0
          fi
          branch=$(jq -c "$summary" "$answer")
          name=$(jq -r '.name' <<< "$branch")
          # Only ever this pull request's own branch: never the default
          # (production) branch, a protected one, or `preview`. A branch
          # that does not say it is neither is refused too.
          if [ "$name" != "$EXPECTED_NAME" ] || ! [[ "$name" =~ ^pr-[0-9]+$ ]] ||
            [ "$(jq -r '.default == false and .protected == false' <<< "$branch")" != "true" ]; then
            echo "::error::Refusing to set an expiry on branch '${name}'."
            exit 1
          fi
          expires_at=$(date -u -d "+${NEON_PR_BRANCH_TTL_DAYS} days" +'%Y-%m-%dT%H:%M:%SZ')
          body=$(jq -nc --arg at "$expires_at" '{branch: {expires_at: $at}}')
          status=$(curl -sS --max-time 30 --retry 2 -o "$answer" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" -d "$body" "$api") || status="000"
          if [ "$status" = "200" ]; then
            echo "before: ${branch}"
            echo "after:  $(jq -c "$summary" "$answer")"
          else
            echo "::warning::Neon answered ${status} to an expiry for ${name}: $(jq -r '.message // .code // "no message"' "$answer" 2>/dev/null || echo unreadable). The branch is still deleted when the pull request closes, and by the nightly sweep."
          fi
          rm -f "$answer"

      - name: Derive audit database URL
        if: steps.neon-creds.outputs.ready == 'true'
        id: audit-url
        env:
          DATABASE_URL: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
        run: |
          # Same Neon project/branch; second database is `audit` (not a second project).
          audit_url="$(python3 -c 'import os; from urllib.parse import urlparse, urlunparse; p=urlparse(os.environ["DATABASE_URL"]); print(urlunparse(p._replace(path="/audit")), end="")')"
          echo "::add-mask::${audit_url}"
          {
            echo "db_url<<EOF"
            echo "${audit_url}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Migrate and apply main + audit RLS
        if: steps.neon-creds.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          AUDIT_DATABASE_URL: ${{ steps.audit-url.outputs.db_url }}
          AUDIT_DATABASE_URL_UNPOOLED: ${{ steps.audit-url.outputs.db_url }}
        run: |
          # db:* scripts load ../../.env.local via tsx --env-file (overrides empty files).
          umask 077
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DATABASE_URL_UNPOOLED=%s\n' "$DATABASE_URL_UNPOOLED"
            printf 'AUDIT_DATABASE_URL=%s\n' "$AUDIT_DATABASE_URL"
            printf 'AUDIT_DATABASE_URL_UNPOOLED=%s\n' "$AUDIT_DATABASE_URL_UNPOOLED"
          } > .env.local
          apply() {
            pnpm --filter=@eleva/db db:migrate &&
            pnpm --filter=@eleva/db db:rls:main &&
            pnpm --filter=@eleva/db db:migrate:audit &&
            pnpm --filter=@eleva/db db:rls:audit
          }
          if ! apply; then
            echo "Migrate failed (compute may still be waking); retrying..."
            sleep 8
            apply
          fi

      - name: RLS isolation, class suite and data migrations
        if: steps.neon-creds.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          AUDIT_DATABASE_URL: ${{ steps.audit-url.outputs.db_url }}
          AUDIT_DATABASE_URL_UNPOOLED: ${{ steps.audit-url.outputs.db_url }}
          ELEVA_RLS_INTEGRATION: "1"
        run: pnpm --filter=@eleva/db exec vitest run --no-file-parallelism src/__tests__/rls-isolation.test.ts src/__tests__/rls-classes.test.ts src/__tests__/rls-notifications.test.ts src/__tests__/rls-session-records.test.ts src/__tests__/rls-money.test.ts src/__tests__/rls-partner-applications.test.ts src/__tests__/rls-clinic-records.test.ts src/__tests__/rls-clinic-verifications.test.ts src/__tests__/rls-crm.test.ts src/__tests__/notification-links-0076.test.ts

      # Domain flows that also write Better Auth tables, as the app's own
      # database role (like production), not the restricted RLS test role.
      - name: Domain integration (app role)
        if: steps.neon-creds.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.reset-branch.outputs.db_url || steps.create-branch.outputs.db_url }}
          AUDIT_DATABASE_URL: ${{ steps.audit-url.outputs.db_url }}
          AUDIT_DATABASE_URL_UNPOOLED: ${{ steps.audit-url.outputs.db_url }}
          ELEVA_DB_INTEGRATION: "1"
        run: |
          pnpm --filter=@eleva/auth exec vitest run --no-file-parallelism src/__tests__/practice-closure.integration.test.ts src/__tests__/team-members.integration.test.ts src/__tests__/clinic-review.integration.test.ts src/__tests__/partner-review.integration.test.ts
          pnpm --filter=@eleva/billing exec vitest run --no-file-parallelism src/server/__tests__/seat-cap.integration.test.ts

  delete-branch:
    name: neon-branch-delete
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Neon credentials
        id: neon-creds
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "::error::Add GitHub secret NEON_API_KEY and secret or variable NEON_PROJECT_ID so closed same-repo PRs delete their Neon branch."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Neon branch delete on fork PR (credentials unavailable)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The branch may be gone already (it expired, or the nightly sweep
      # took it): that is the outcome this job wants, not a failure.
      - name: Find the branch
        if: steps.neon-creds.outputs.ready == 'true'
        id: find-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          BRANCH_NAME: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          # If Neon cannot be asked, try the delete as before: skipping it
          # on a failed lookup would leave the branch behind.
          if ! found=$(curl -fsS --max-time 30 --retry 2 \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${api}/branches?search=${BRANCH_NAME}&limit=100" |
            jq -r --arg name "$BRANCH_NAME" '[.branches[] | select(.name == $name)] | length'); then
            echo "::warning::Could not look ${BRANCH_NAME} up; trying the delete."
            found=1
          fi
          if [ "$found" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${BRANCH_NAME} is already gone; nothing to delete."
          fi

      - name: Delete Neon branch
        if: steps.neon-creds.outputs.ready == 'true' && steps.find-branch.outputs.exists == 'true'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
