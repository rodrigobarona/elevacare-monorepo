packages:
  - "apps/*"
  - "packages/*"
  - "infra/*"

strictPeerDependencies: true
autoInstallPeers: true
enablePrePostScripts: true

peerDependencyRules:
  allowedVersions:
    "react-intl>typescript": "6"
    "@formatjs/intl>typescript": "6"

patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  msw: true
  sharp: true

catalog:
  # Framework
  next: ^16.2.6
  react: ^19.2.6
  react-dom: ^19.2.6
  next-intl: ^4.12.0
  next-themes: ^0.4.6

  # Types
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@types/node": ^25.8.0

  # Build & lint
  typescript: ^6.0.3
  eslint: ^10.4.0
  "@tailwindcss/postcss": ^4.3.0
  tailwindcss: ^4.3.0
  tsx: ^4.22.0
  prettier: ^3.8.3

  # Testing
  vitest: ^4.1.6
  "@vitest/coverage-v8": ^4.1.6
  "@playwright/test": ^1.56.1

  # Auth (Better Auth 1.7.3 — spike 02.0)
  better-auth: 1.7.3
  "@better-auth/passkey": 1.7.3
  "@better-auth/api-key": 1.7.3
  "@better-auth/drizzle-adapter": 1.7.3

  # Payments (Stripe)
  stripe: ^22.1.1
  "@stripe/stripe-js": ^9.5.0

  # Email
  resend: ^6.12.3

  # Infrastructure
  "@upstash/redis": ^1.38.0
  "@neondatabase/serverless": ^1.1.0

  # Database
  drizzle-orm: ^0.45.2

  # UI
  sonner: ^2.0.7
  zod: ^4.4.3

  # Maps (PoC)
  leaflet: ^1.9.4
  react-leaflet: ^5.0.0
  "@types/leaflet": ^1.9.21
