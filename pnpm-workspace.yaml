packages:
  - "apps/*"
  - "packages/*"
  - "infra/*"

strictPeerDependencies: true
autoInstallPeers: true
enablePrePostScripts: true

peerDependencyRules:
  allowedVersions:
    "react-intl>typescript": "6"
    "@formatjs/intl>typescript": "6"

patchedDependencies:
  "@workos-inc/widgets-i18n": "patches/@workos-inc__widgets-i18n.patch"
  next-themes@0.4.6: patches/next-themes@0.4.6.patch

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  msw: true
  sharp: true

catalog:
  # Framework
  next: ^16.2.6
  react: ^19.2.6
  react-dom: ^19.2.6
  next-intl: ^4.12.0
  next-themes: ^0.4.6

  # Types
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@types/node": ^25.8.0

  # Build & lint
  typescript: ^6.0.3
  eslint: ^10.4.0
  "@tailwindcss/postcss": ^4.3.0
  tailwindcss: ^4.3.0
  tsx: ^4.22.0
  prettier: ^3.8.3

  # Testing
  vitest: ^4.1.6
  "@vitest/coverage-v8": ^4.1.6

  # Auth (WorkOS)
  "@workos-inc/authkit-nextjs": ^4.1.0
  "@workos-inc/node": ^9.3.0
  "@workos-inc/widgets": ^1.12.0
  "@workos-inc/widgets-i18n": ^1.0.0

  # Payments (Stripe)
  stripe: ^22.1.1
  "@stripe/stripe-js": ^9.5.0

  # Email
  resend: ^6.12.3

  # Infrastructure
  "@upstash/redis": ^1.38.0
  "@neondatabase/serverless": ^1.1.0

  # Database
  drizzle-orm: ^0.45.2

  # UI
  "@radix-ui/themes": ^3.3.0
  sonner: ^2.0.7
  zod: ^4.4.3
