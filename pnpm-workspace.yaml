packages:
  - "apps/*"
  - "packages/*"
  - "infra/*"

strictPeerDependencies: true
autoInstallPeers: true
enablePrePostScripts: true

peerDependencyRules:
  allowedVersions:
    "react-intl>typescript": "6"
    "@formatjs/intl>typescript": "6"

# Security floors for transitive dependencies (pnpm audit --prod, high and
# critical). Each pin stays inside the major its parents already use; drop a
# line once every parent ships the patched version itself.
overrides:
  "@modelcontextprotocol/sdk": ^1.32.2
  body-parser: ^2.4.0
  brace-expansion@5: ^5.0.12
  browserslist: ^4.29.5
  dompurify: ^3.4.17
  engine.io: ^6.6.11
  fast-uri: ^3.1.9
  follow-redirects: ^1.16.2
  hono: ^4.13.17
  ip-address: ^10.7.6
  js-yaml@4: ^4.3.2
  nanoid@3: ^3.3.20
  next: ^16.4.5
  postcss: ^8.5.32
  proxy-addr: ^2.0.8
  sharp: ^0.35.5
  socket.io-parser: ^4.2.7
  source-map-js: ^1.2.2
  undici@7: ^7.30.2
  ws@8: ^8.22.1
  zod@4: ^4.6.7

# Advisories reviewed and accepted. Remove an entry once its path is gone.
auditConfig:
  ignoreGhsas:
    # vite dev-server launch-editor bypass on Windows; vite is a build-time
    # peer of vitest and fumadocs-mdx and never serves production traffic.
    - GHSA-587h-7wmj-h5pm
    # zod 3 under the shadcn CLI's MCP server (shadcn > @modelcontextprotocol/sdk);
    # that CLI never runs in a deployed app. App code uses zod 4.6.7.
    - GHSA-mrhx-c7xc-m3w5

patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  msw: true
  sharp: true

catalog:
  # Framework
  next: ^16.4.5
  react: ^19.2.6
  react-dom: ^19.2.6
  next-intl: ^4.12.0
  next-themes: ^0.4.6

  # Types
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@types/node": ^25.8.0

  # Build & lint
  typescript: ^6.0.3
  eslint: ^10.4.0
  "@tailwindcss/postcss": ^4.3.0
  tailwindcss: ^4.3.0
  tsx: ^4.22.0
  prettier: ^3.8.3

  # Testing
  vitest: ^4.1.6
  "@vitest/coverage-v8": ^4.1.6
  "@playwright/test": ^1.56.1
  "@axe-core/playwright": ^4.13.0

  # Auth (Better Auth 1.7.3 — spike 02.0)
  better-auth: 1.7.18
  "@better-auth/passkey": 1.7.18
  "@better-auth/api-key": 1.7.18
  "@better-auth/drizzle-adapter": 1.7.18
  "@better-auth/i18n": 1.7.18

  # Payments (Stripe)
  stripe: ^22.1.1
  "@stripe/stripe-js": ^9.5.0

  # Cookie consent (c15t on Inth)
  "@c15t/nextjs": 3.1.0
  c15t: 3.1.0

  # Bot protection (Vercel BotID)
  botid: ^1.5.11
  "@stripe/react-stripe-js": 6.6.0

  # Email
  resend: ^6.12.3

  # SMS
  twilio: ^5.11.1

  # Object storage (Cloudflare R2 via the S3 API — ADR-025)
  "@aws-sdk/client-s3": ^3.1161.0
  "@aws-sdk/s3-request-presigner": ^3.1161.0

  # Infrastructure
  "@upstash/redis": ^1.38.0
  "@neondatabase/serverless": ^1.1.0

  # Database
  drizzle-orm: ^0.45.2

  # JWT (Better Auth verify + Daily self-signed meeting tokens)
  jose: ^6.1.0

  # Video (Daily.co — ADR-018)
  "@daily-co/daily-js": ^0.93.0
  "@daily-co/daily-react": ^0.26.0

  # UI
  sonner: ^2.0.7
  zod: ^4.6.7
  libphonenumber-js: ^1.12.38

  # Maps (PoC)
  leaflet: ^1.9.4
  react-leaflet: ^5.0.0
  "@types/leaflet": ^1.9.21

  # Long-form content (headless Fumadocs — @eleva/content, decision 2026-10-21)
  fumadocs-core: 16.17.7
  fumadocs-mdx: 15.4.9
  "@types/mdx": ^2.0.14

  # Rich text (Plate / ADR-023 — @eleva/editor)
  platejs: ^53.3.14
  "@platejs/basic-nodes": ^53.0.0
  isomorphic-dompurify: ^2.17.0

  # Opt-in public profile performance gate (Phase 04 AC)
  lighthouse: ^12.8.1
