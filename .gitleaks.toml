title = "Eleva.care"

[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholder fragments in .env.example (ellipsis, not live secrets)"
regexes = [
  '''sk_test_\.\.\.''',
  '''client_\.\.\.''',
  '''whsec_\.\.\.''',
  '''re_\.\.\.''',
  '''AC\.\.\.''',
]

[[allowlists]]
description = "Tracked reference snapshots, not product code (also excluded from CodeRabbit path_filters)"
paths = [
  '''(^|/)(_context/)''',
]
